<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Additional received bytes and observations with a gain</title>
<desc id="desc">402192 bytes in additional PDUs minus 1056 bytes in missed PDUs equals 401136 net extra bytes. Headers included, FCS excluded; not application-only bytes. 141 of 266 observations have an added packet. Additions can coexist with missed packets; these are not independent trials.</desc>
<rect width="1200" height="520" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" style="font-variant-numeric:tabular-nums">
<text x="48" y="64" font-size="36" fill="#152e43" font-weight="700">Additional received data</text>
<text x="48" y="104" font-size="25" fill="#526879" font-weight="400">Protocol bytes (including headers; excluding FCS)</text>
<text x="48" y="165" font-size="25" fill="#087e70" font-weight="400">Added bytes</text>
<text x="440" y="165" font-size="25" fill="#a7462d" font-weight="400">Missed bytes</text>
<text x="820" y="165" font-size="25" fill="#152e43" font-weight="400">Net extra bytes</text>
<text x="48" y="228" font-size="51" fill="#087e70" font-weight="700">+402,192</text>
<text x="440" y="228" font-size="51" fill="#a7462d" font-weight="700">−1,056</text>
<text x="820" y="228" font-size="51" fill="#152e43" font-weight="700">401,136</text>
<text x="48" y="320" font-size="27" fill="#152e43" font-weight="700">Recordings with additional packets</text>
<text x="48" y="385" font-size="46" fill="#152e43" font-weight="700">141 / 266</text>
<text x="949" y="385" font-size="40" fill="#087e70" font-weight="700">53.01%</text>
<rect data-role="observation-share" data-gain="true" data-value="141" data-total="266" x="48.000" y="418" width="585.203" height="32" fill="#087e70"/>
<rect data-role="observation-share" data-gain="false" data-value="125" data-total="266" x="633.203" y="418" width="518.797" height="32" fill="#e3eaf0"/>
<text x="48" y="490" font-size="25" fill="#152e43" font-weight="400">141 with additions</text>
<text x="820" y="490" font-size="25" fill="#526879" font-weight="400">125 without additions</text>
</g></svg>
