clock_recovery:
  implementation_family: mueller_and_muller
  baseline:
    omega: 2.0
    mu: 0.5
    gain_mu: 0.0625
    gain_omega: 0.06283185307179587
    omega_relative_limit: 0.01
  design: one_axis_at_a_time_around_official_baseline
  axes:
    omega: [1.98, 1.99, 1.995, 2.0, 2.005, 2.01, 2.02]
    mu: [0.0, 0.25, 0.5, 0.75]
    gain_mu: [0.03125, 0.0625, 0.125]
    gain_omega: [0.031415926535897934, 0.06283185307179587, 0.12566370614359174]
    omega_relative_limit: [0.005, 0.01, 0.02]
  unique_candidate_count: 16
  prohibit_cartesian_expansion: true
  prohibit_post_validation_axis_changes: true

candidate_selection:
  calibration_only: true
  calibration_repeats: 2
  promote_count: 4
  always_include_baseline_in_validation: true
  maximum_validation_candidates_including_baseline: 5
  rank_lexicographically:
    - exact_crc_valid_reference_matches_desc
    - complete_crc_valid_frame_count_desc
    - median_lsb_first_reference_correlation_desc
    - lsb_over_msb_correlation_advantage_desc
    - canonical_config_sha256_asc
  correlation_is_diagnostic_only: true
  freeze_artifact_required:
    fields: [ordered_candidate_hashes, source_hashes, axis_definition_hash, calibration_metrics_hash]
    written_before_validation: true

acceptance_contract:
  comparison_unit: complete_ax25_frame_after_validated_fcs_removal
  require_crc_valid_before_removing_exactly_two_fcs_bytes: true
  require_equal_length: true
  require_byte_identical: true
  require_match_to_reference_assigned_to_same_split: true
  partial_matches_accepted: 0
  prefix_matches_accepted: false
  suffix_matches_accepted: false
  substring_matches_accepted: false
  truncated_frames_accepted: false
  unconditional_fcs_removal: false
  manual_bit_correction: forbidden
  manual_alignment_after_freeze: forbidden
  correlation_can_establish_success: false

controls:
  positive_synthetic:
    repeats: 2
    expected: exactly_one_crc_valid_byte_identical_frame_each_repeat
  negative_synthetic:
    repeats_per_control: 2
    controls: [descrambler_disabled, msb_first_byte_order, single_bit_corruption_without_fcs_recalculation]
    expected_exact_matches: 0
  validation_negatives:
    repeats_per_control: 2
    controls: [descrambler_disabled, msb_first_byte_order, event_free_time_window]
    expected_exact_matches: 0

repeatability_gate:
  validation_repeats: 3
  require_each_repeat_has_validation_match: true
  require_ordered_complete_frame_sequence_equal: true
  require_exact_match_count_equal: true
  require_accepted_frame_sha256_sequence_equal: true
  sliced_stream_sha256_required_equal: false
  sliced_stream_reason: TPB scheduling already produced nondeterministic intermediate M-and-M streams
  final_full_record_repeats: 3
  require_full_record_ordered_frame_sequence_equal: true

stages:
  - id: control_gate
    maximum_attempts: 8
  - id: calibration_oat
    maximum_attempts: 32
  - id: locked_validation
    maximum_attempts: 15
  - id: validation_negative_controls
    maximum_attempts: 6
  - id: winner_full_record_confirmation
    maximum_attempts: 3

stop_rules:
  - stop_invalid_harness_if_positive_control_fails_or_any_synthetic_negative_exactly_matches
  - stop_after_calibration_and_freeze_exactly_four_promoted_hashes_plus_baseline
  - stop_fail_if_no_locked_candidate_passes_all_three_validation_repeats
  - stop_fail_if_any_validation_negative_control_exactly_matches
  - stop_success_after_one_candidate_passes_validation_and_three_full_record_repeats
  - stop_at_64_attempts_with_no_axis_expansion_or_rescue_grid
  - stop_resource_if_projected_total_exceeds_4800_cpu_seconds_or_268435456_disk_bytes_or_1800_wall_seconds
  - validation_failure_must_not_trigger_retuning

resource_budget:
  available_vcpu: 4
  max_parallel_workers: 3
  max_attempts: 64
  assumed_cpu_seconds_per_attempt: 60
  assumed_disk_bytes_per_attempt: 2097152
